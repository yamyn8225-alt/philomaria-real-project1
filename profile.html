<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الملف الشخصي - Philomaria</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="profile-page">

        <div class="profile-card">

            <!-- ============================= -->
            <!-- عنوان الصفحة -->
            <!-- ============================= -->

            <div class="profile-header">

                <h1>
                    الملف الشخصي
                </h1>

                <p>
                    بيانات الطالب
                </p>

            </div>


            <!-- ============================= -->
            <!-- صورة الطالب -->
            <!-- ============================= -->

            <div class="profile-image-container">

                <img
                    id="profile-image"
                    src="philomaria .png"
                    alt="صورة الطالب"
                >

            </div>


            <!-- ============================= -->
            <!-- بيانات الطالب -->
            <!-- ============================= -->

            <div class="profile-info">

                <h2 id="profile-name">
                    اسم الطالب
                </h2>


                <div class="profile-data-row">

                    <span class="profile-label">
                        البريد الإلكتروني:
                    </span>

                    <span id="profile-email">
                        -
                    </span>

                </div>


                <div class="profile-data-row">

                    <span class="profile-label">
                        رقم التليفون:
                    </span>

                    <span id="profile-phone">
                        -
                    </span>

                </div>


                <div class="profile-data-row">

                    <span class="profile-label">
                        السنة الدراسية:
                    </span>

                    <span id="profile-study-year">
                        -
                    </span>

                </div>


                <div class="profile-data-row">

                    <span class="profile-label">
                        الترم:
                    </span>

                    <span id="profile-study-term">
                        -
                    </span>

                </div>


                <div class="profile-data-row">

                    <span class="profile-label">
                        الكنيسة:
                    </span>

                    <span id="profile-church-name">
                        -
                    </span>

                </div>

            </div>


            <!-- ============================= -->
            <!-- Actions -->
            <!-- ============================= -->

            <div class="profile-actions">

                <a
                    href="student.html"
                    class="button profile-home-button"
                >
                    العودة للصفحة الرئيسية
                </a>


                <button
                    type="button"
                    class="button"
                    id="logout-button"
                >
                    تسجيل الخروج
                </button>


                <button
                    type="button"
                    class="delete-account-button"
                    id="delete-account-button"
                >
                    حذف الحساب
                </button>

            </div>

        </div>

    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
