<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>صفحة الطالب - Philomaria</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="student-page">

        <!-- ============================= -->
        <!-- SIDEBAR -->
        <!-- ============================= -->

        <nav class="navbar_student">

            <div class="logo">

                <img
                    src="philomaria .png"
                    alt="Philomaria Logo"
                >

            </div>


            <div class="nav-links">

                <a
                    class="aa"
                    href="index.html"
                >
                    الرئيسية
                </a>


                <a
                    class="aa"
                    href="#courses"
                >
                    الكورسات
                </a>


                <a
                    class="aa"
                    href="profile.html"
                >
                    حسابي
                </a>

            </div>

        </nav>


        <!-- ============================= -->
        <!-- WELCOME SECTION -->
        <!-- ============================= -->

        <section class="welcome-section">

            <h1 id="welcome-message">
                أهلاً بك
            </h1>


            <p>
                سعيدين بوجودك معنا، ابدأ رحلتك التعليمية اليوم.
            </p>


            <!-- Student Study Information -->
            <div class="student-study-info">

                <p>
                    السنة الدراسية:
                    <strong id="student-study-year">
                        -
                    </strong>
                </p>


                <p>
                    الترم:
                    <strong id="student-study-term">
                        -
                    </strong>
                </p>

            </div>

        </section>


        <!-- ============================= -->
        <!-- COURSES -->
        <!-- ============================= -->

        <section
            class="courses-section"
            id="courses"
        >

            <h1>
                الكورسات
            </h1>


            <p>
                الكورسات المتاحة لك حسب السنة الدراسية والترم.
            </p>


            <div
                class="courses-container"
                id="student-courses-container"
            >

                <!--
                    الكورسات التي ينشئها المدرس
                    سيتم عرضها هنا بواسطة JavaScript
                    حسب السنة الدراسية والترم
                -->

            </div>

        </section>

    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
